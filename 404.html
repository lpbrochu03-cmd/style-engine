<style>
/* @theme:start — generated by build_pages.py; edit theme.css instead */
/* ===========================================================================
   Style Engine — the theme. One file, every page.

   WHY THIS FILE EXISTS
   The palette used to be written out four times: once in the app, once in the
   landing page, once in 404.html, and once more inside build_pages.py for the
   generated pages. They had already drifted — the site carried a flattened
   copy of the app's dark set with the light half and three of the five
   palettes missing. Two copies of a colour is the same problem as two copies
   of a privacy promise: the day they disagree, one of them is wrong and
   nobody notices.

   This is now the only place any of it is written. build_pages.py reads it the
   same way it already reads PRIVACY.md, TERMS.md and store.json — one
   direction, app to site — and inlines it into every page it builds. The two
   hand-written pages get it written between markers by the same script.

   HOW TO USE IT
   Never link this file. Every page on this site is meant to stand up on its
   own with no second request, so it is inlined at build time. The one token
   that cannot be static is the path to the font files, because the pages sit
   at different depths; `assets` is substituted per page.

       python build_pages.py        # rebuilds generated pages AND syncs the
                                    # hand-written ones between their markers

   THE SHAPE
   Two independent axes, unchanged from the system this replaces. A *palette*
   says what the instrument is made of; *light/dark* says whether the lights
   are on. Each palette declares both sets at once — `--l-*` for daylight,
   `--d-*` for dark — and the resolver at the end is the only place that picks.
   A new palette is one block of colour, not a fourth copy of the switching
   logic.

   Every palette is a real surface someone writes on or measures with. That is
   the constraint that keeps this from being a hue slider. --accent is the
   instrument's own mark, --clay means something is wrong, --amber means look
   at this, --good means it went well. Those four stay tellable apart inside
   every palette.
   =========================================================================== */

/* ---------------------------------------------------------------------------
   Faces.

   Self-hosted, and that is the whole point rather than a preference. The
   page's claim is that nothing is sent anywhere; a page that pulls a font from
   a third party tells every visitor's browser to announce itself to that third
   party before a word is rendered. These two files are served from the same
   origin as the page, so the claim survives having a typeface.

   Both are variable across their weight axis, so the display face's 700 and
   the body face's 450 cost nothing extra — 69 KB for the pair, latin only.

   font-display:swap so text paints immediately in the fallback stack and
   reflows when the face lands. A page whose argument is "read this" must never
   open blank waiting for a font.
--------------------------------------------------------------------------- */
@font-face{
  font-family:'Space Grotesk';font-style:normal;font-weight:400 700;font-display:swap;
  src:url('assets/fonts/SpaceGrotesk-400-700.woff2') format('woff2');
}
@font-face{
  font-family:'Inter';font-style:normal;font-weight:400 700;font-display:swap;
  src:url('assets/fonts/Inter-400-700.woff2') format('woff2');
}
/* The instrument face. In the app this is not a code font sitting in a corner
   — it carries every heading, every nav channel, every label and every
   measured value on screen, because "the instrument speaks in monospace" is
   that page's whole design. Left as the system stack it spoke in Consolas on
   one machine and SF Mono on another, which is no voice at all. Three static
   weights rather than a variable axis: 400 reads the values, 500 the labels,
   600 the headings, and Plex has no variable build to take instead. */
@font-face{
  font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;
  src:url('assets/fonts/IBMPlexMono-400.woff2') format('woff2');
}
@font-face{
  font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;
  src:url('assets/fonts/IBMPlexMono-500.woff2') format('woff2');
}
@font-face{
  font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;
  src:url('assets/fonts/IBMPlexMono-600.woff2') format('woff2');
}

/* ---------------------------------------------------------------------------
   Palettes. The dark sets are the ones that changed: every ground has come
   down to near-black so the page reads as unlit rather than merely dim, and
   an OLED panel can switch those pixels off entirely.

   None of them is a neutral grey. Each keeps its own hue in the ground —
   olive, press-grey, cyanotype blue, iris, steel — because a true #000 page
   has no material, and the whole conceit here is that every palette is a
   surface. Read them side by side and the casts are obvious; read one alone
   and it just looks black.

   Accents were lifted a few points at the same time. A green that carried on
   #14160f is doing more work on #080a05, and contrast is measured against the
   ground it actually sits on.
--------------------------------------------------------------------------- */

/* Sage — a drafting table. Olive paper, forest ink. The original, and the
   default for anyone who never opens the picker. */
:root, :root[data-palette="sage"]{
  --l-ground:#e7e8e0; --l-surface:#f4f5ef; --l-surface-2:#dcded3;
  --l-ink:#191b14; --l-ink-2:#4b4e43; --l-ink-3:#7d8173; --l-line:#c5c7b9;
  --l-accent:#2b6141; --l-accent-soft:#d6e3d8; --l-on-accent:#f4f5ef;
  --l-amber:#8a6412; --l-amber-soft:#eadfc4;
  --l-good:#2b6141;  --l-good-soft:#d6e3d8;
  --l-clay:#a3472f;  --l-clay-soft:#ecd8d0; --l-pay:#1b4230;
  --d-ground:#080a05; --d-surface:#0e1109; --d-surface-2:#151910;
  --d-ink:#eef1e2; --d-ink-2:#b6bba6; --d-ink-3:#838873; --d-line:#222719;
  --d-accent:#7fd39f; --d-accent-soft:#101c13; --d-on-accent:#060803;
  --d-amber:#dcae56; --d-amber-soft:#1e1a0d;
  --d-good:#7fd39f;  --d-good-soft:#101c13;
  --d-clay:#e08a6b;  --d-clay-soft:#1f120c; --d-pay:#12301f;
}

/* Newsprint — grey stock, black ink. The red is the editor's pencil, so it
   stays reserved for what's wrong; the accent is the ink itself. Dark mode
   inverts to the press plate: white ink, black paper. */
:root[data-palette="newsprint"]{
  --l-ground:#e6e5e1; --l-surface:#f2f1ed; --l-surface-2:#d9d7d1;
  --l-ink:#17171a; --l-ink-2:#4a4a50; --l-ink-3:#7c7c84; --l-line:#c5c3bc;
  --l-accent:#22222a; --l-accent-soft:#dcdad4; --l-on-accent:#f2f1ed;
  --l-amber:#8a5f12; --l-amber-soft:#ecdfc4;
  --l-good:#2f6048;  --l-good-soft:#d8e5de;
  --l-clay:#a5342a;  --l-clay-soft:#f0d9d5; --l-pay:#22222a;
  --d-ground:#070709; --d-surface:#0d0d10; --d-surface-2:#141418;
  --d-ink:#eeece6; --d-ink-2:#b2b0aa; --d-ink-3:#807e79; --d-line:#202026;
  --d-accent:#eeece5; --d-accent-soft:#17171b; --d-on-accent:#060608;
  --d-amber:#dcae58; --d-amber-soft:#1e190e;
  --d-good:#7fc9a4;  --d-good-soft:#101e17;
  --d-clay:#e6806d;  --d-clay-soft:#211110; --d-pay:#17171b;
}

/* Blueprint — drafting paper in daylight; an actual cyanotype after dark,
   which is the one palette here that changes what the page *is* rather than
   how bright it is. */
:root[data-palette="blueprint"]{
  --l-ground:#eaeef4; --l-surface:#f6f8fb; --l-surface-2:#dbe2ec;
  --l-ink:#10192b; --l-ink-2:#3d4b63; --l-ink-3:#6f7c94; --l-line:#bfcada;
  --l-accent:#1b4f8f; --l-accent-soft:#d5e2f2; --l-on-accent:#f6f8fb;
  --l-amber:#8a6412; --l-amber-soft:#ecdfc4;
  --l-good:#1f6b57;  --l-good-soft:#d3e8e1;
  --l-clay:#a33f3f;  --l-clay-soft:#f0d9d9; --l-pay:#123a6b;
  --d-ground:#04101f; --d-surface:#08192e; --d-surface-2:#0c2039;
  --d-ink:#eaf1fc; --d-ink-2:#abc0da; --d-ink-3:#768cab; --d-line:#14294a;
  --d-accent:#8bbaf5; --d-accent-soft:#0a1a30; --d-on-accent:#030d1a;
  --d-amber:#dcae58; --d-amber-soft:#1f1a0f;
  --d-good:#75ccb2;  --d-good-soft:#0c2620;
  --d-clay:#e69494;  --d-clay-soft:#251214; --d-pay:#0e2547;
}

/* Ink — fountain pen on cool paper: iris for the accent, yama-budo red for
   what's wrong. Both are ink colours you can actually buy. */
:root[data-palette="ink"]{
  --l-ground:#ecebf0; --l-surface:#f7f6fa; --l-surface-2:#e0dde8;
  --l-ink:#1a1725; --l-ink-2:#4a4560; --l-ink-3:#7b7590; --l-line:#cbc6d6;
  --l-accent:#55408c; --l-accent-soft:#e0daf0; --l-on-accent:#f7f6fa;
  --l-amber:#8a6412; --l-amber-soft:#ecdfc4;
  --l-good:#2f6b52;  --l-good-soft:#d7e7de;
  --l-clay:#a03a5c;  --l-clay-soft:#f0d8e2; --l-pay:#372a63;
  --d-ground:#08060f; --d-surface:#0e0b19; --d-surface-2:#151122;
  --d-ink:#eeebf7; --d-ink-2:#b4aec8; --d-ink-3:#817b98; --d-line:#1e1930;
  --d-accent:#ac96ec; --d-accent-soft:#130f26; --d-on-accent:#06040c;
  --d-amber:#dcae58; --d-amber-soft:#1e190e;
  --d-good:#7dceaa;  --d-good-soft:#101e17;
  --d-clay:#e68cb0;  --d-clay-soft:#210f19; --d-pay:#1d1740;
}

/* Slate — the quiet one. A machined instrument panel: cool greys, steel
   accent, everything warm reserved for a warning. */
:root[data-palette="slate"]{
  --l-ground:#e4e6e7; --l-surface:#f1f3f4; --l-surface-2:#d6dadc;
  --l-ink:#14181a; --l-ink-2:#444b4f; --l-ink-3:#757d82; --l-line:#bcc3c6;
  --l-accent:#35586b; --l-accent-soft:#d6e0e6; --l-on-accent:#f1f3f4;
  --l-amber:#8a6a1f; --l-amber-soft:#ecdfc4;
  --l-good:#2f6b52;  --l-good-soft:#d7e7de;
  --l-clay:#9c4a34;  --l-clay-soft:#f0dbd4; --l-pay:#24404e;
  --d-ground:#06080a; --d-surface:#0c0f11; --d-surface-2:#12161a;
  --d-ink:#ebeff1; --d-ink-2:#afb7bb; --d-ink-3:#7c8489; --d-line:#1c2126;
  --d-accent:#9bbfd3; --d-accent-soft:#0e1c24; --d-on-accent:#040607;
  --d-amber:#d8ad62; --d-amber-soft:#1e190e;
  --d-good:#7ec9a8;  --d-good-soft:#101e17;
  --d-clay:#e39076;  --d-clay-soft:#211310; --d-pay:#152836;
}

/* ---------------------------------------------------------------------------
   The resolver. Written once; every palette above flows through it.

   Dark is the default, and it is a decision rather than a fallback. This is an
   instrument you read measurements off, most often at night at a desk, and
   every palette here was drawn as a real surface — the dark sets aren't an
   inverted afterthought, they're the cyanotype, the press plate, the unlit
   drafting table. Following the OS instead would show most visitors the
   daylight set on a first visit, which is not the face this thing opens with.

   The reader still decides: the toggle writes data-theme and that beats
   everything here, on that device, forever.
--------------------------------------------------------------------------- */
:root{
  /* Tells the browser which way round its own furniture goes: the scrollbar,
     the date picker, the dropdown a <select> opens. Without it they render
     light on a black page — the one part of a dark theme you can't style your
     way out of. */
  color-scheme: dark;
  --ground: var(--d-ground); --surface: var(--d-surface); --surface-2: var(--d-surface-2);
  --ink: var(--d-ink); --ink-2: var(--d-ink-2); --ink-3: var(--d-ink-3); --line: var(--d-line);
  --accent: var(--d-accent); --accent-soft: var(--d-accent-soft); --on-accent: var(--d-on-accent);
  --amber: var(--d-amber); --amber-soft: var(--d-amber-soft);
  --good: var(--d-good); --good-soft: var(--d-good-soft);
  --clay: var(--d-clay); --clay-soft: var(--d-clay-soft);
  --data: var(--d-accent); --pay: var(--d-pay);

  /* Depth on a near-black page cannot come from a lighter box: at these
     grounds a raised surface is only a few points away and reads as a smudge.
     It comes from a shadow beneath and a one-pixel lift above, which is why
     these are shadows rather than borders. */
  --shadow:    0 1px 0 rgba(0,0,0,.5);
  --elev-1:    0 1px 2px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.028);
  --elev-2:    0 6px 22px -6px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04);
  --shadow-lg: 0 18px 56px -12px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.045);
  /* The accent's own light. Used on the one control per view that matters, and
     nowhere else — a page where everything glows has no emphasis left. */
  --glow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent),
          0 8px 30px -8px color-mix(in srgb, var(--accent) 45%, transparent);
}
:root[data-theme="light"]{
  color-scheme: light;
  --ground: var(--l-ground); --surface: var(--l-surface); --surface-2: var(--l-surface-2);
  --ink: var(--l-ink); --ink-2: var(--l-ink-2); --ink-3: var(--l-ink-3); --line: var(--l-line);
  --accent: var(--l-accent); --accent-soft: var(--l-accent-soft); --on-accent: var(--l-on-accent);
  --amber: var(--l-amber); --amber-soft: var(--l-amber-soft);
  --good: var(--l-good); --good-soft: var(--l-good-soft);
  --clay: var(--l-clay); --clay-soft: var(--l-clay-soft);
  --data: var(--l-accent); --pay: var(--l-pay);
  --shadow:    0 1px 0 rgba(25,27,20,.05);
  --elev-1:    0 1px 2px rgba(25,27,20,.08), 0 0 0 1px rgba(25,27,20,.05);
  --elev-2:    0 6px 22px -6px rgba(25,27,20,.14), 0 0 0 1px rgba(25,27,20,.06);
  --shadow-lg: 0 18px 56px -12px rgba(25,27,20,.2), 0 0 0 1px rgba(25,27,20,.07);
  --glow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent),
          0 8px 30px -10px color-mix(in srgb, var(--accent) 35%, transparent);
}

/* ---------------------------------------------------------------------------
   Type, space, motion.

   --sans and --mono keep their names. Every existing rule in the app and on
   the site reaches for them, and renaming a token that is already correct is
   how a redesign turns into a rewrite.
--------------------------------------------------------------------------- */
:root{
  --display:'Space Grotesk','Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",monospace;
  /* The human face. In the app "serif means a person wrote it" is a rule with
     meaning attached, so it needs a name — it was written out as a five-item
     stack in six different places, which is how a rule quietly stops applying
     in one of them. Left as a system stack on purpose: it marks the reader's
     own words, and their own words should look like the machine had no hand
     in setting them. */
  --serif:ui-serif,"Iowan Old Style",Georgia,"Times New Roman",serif;

  /* A scale rather than a clamp() re-guessed per component, which is what made
     three pages disagree about what "a heading" is. */
  --t-micro: clamp(10.5px,2.4vw,11.5px);
  --t-xs:    clamp(12px,2.8vw,13px);
  --t-sm:    clamp(13.5px,3.2vw,15px);
  --t-base:  clamp(16px,1.02rem + .2vw,18px);
  --t-lg:    clamp(1.05rem,3.6vw,1.3rem);
  --t-xl:    clamp(1.2rem,4.4vw,1.6rem);
  --t-2xl:   clamp(1.32rem,4.6vw,1.72rem);
  --t-3xl:   clamp(2rem,6.4vw,3.4rem);
  --t-display:clamp(2.6rem,10.5vw,5.6rem);

  --track-mono:.16em;   /* the uppercase mono labels */
  --track-tight:-.035em;/* display sizes, which need pulling in */

  --gutter:clamp(20px,5.5vw,64px);
  --measure:34rem;
  --radius-sm:6px; --radius:12px; --radius-lg:18px; --radius-pill:999px;

  /* Motion. One vocabulary, all of it inside the range where a transition
     reads as responsiveness rather than as an animation you are made to watch.
     --ease-out is the existing curve from the site's scroll reveal, kept so
     new motion matches what is already there. */
  --dur-1:150ms;  /* press, colour, the smallest acknowledgements */
  --dur-2:220ms;  /* hover, focus, the standard one */
  --dur-3:320ms;  /* entrances, things arriving */
  --dur-4:400ms;  /* the largest move anything here is allowed to make */
  --ease-out:cubic-bezier(.22,.9,.28,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --ease-spring:cubic-bezier(.34,1.35,.64,1);
}

/* ---------------------------------------------------------------------------
   Keyframes.

   Declared here rather than in theme-site.css because the app uses them too,
   and a @keyframes that is referenced but never declared fails silently —
   the element simply sits at its start state forever.
--------------------------------------------------------------------------- */
@keyframes se-rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes se-fade{from{opacity:0}to{opacity:1}}
/* The one loading state. A bar that travels rather than a spinner that turns:
   this thing measures left to right, and the wait should look like the same
   motion. */
@keyframes se-sweep{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

/* ---------------------------------------------------------------------------
   THAT IS THE WHOLE FILE. Nothing below this line, and nothing above it that
   is not a custom property, an @font-face or a @keyframes.

   That constraint is deliberate and worth keeping. This file is inlined into
   the app as well as the site, and the two do not share a control language:
   the site's calls to action are filled pills, and the app's buttons are 2px-
   radius bordered controls because it is an instrument rather than a page. A
   `.btn` rule in here would have turned all forty-nine of the app's buttons
   into green pills the moment it was synced.

   So: declarations that *offer* a value go here, where they cannot collide
   with anything. Rules that *apply* one go in theme-site.css, which only the
   site's own pages take.
--------------------------------------------------------------------------- */
/* ===========================================================================
   Style Engine — the site's base and controls.

   theme.css declares values; this applies them. The split exists because
   theme.css is inlined into the app too, and the app has its own control
   language — 2px-radius bordered buttons, because it is an instrument you
   read measurements off, not a page that is selling you something. A `.btn`
   rule shared between the two would have made every button in the app a green
   pill.

   So this file is the site's half: the reset, the type defaults, and the
   buttons, inputs and links that the landing page, the 404 and the three
   generated pages all share. The app never sees it.

   Read with theme.css. Every value below comes from there.
   =========================================================================== */

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:var(--t-base);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  /* Inter ships proportional figures by default. Every column of numbers on
     this site is a measurement being read down the column, and proportional
     digits make those columns ragged. */
  font-variant-numeric:tabular-nums;
}
img,video{display:block;max-width:100%}
a{color:inherit}

/* Headings take the display face. Space Grotesk is narrower and more even in
   colour than the fallback stack at these sizes, so the tracking is pulled in
   rather than left to drift open. */
h1,h2,h3,.display,.section-title{
  font-family:var(--display);
  letter-spacing:var(--track-tight);
  text-wrap:balance;
}

/* One focus ring for the whole site. An instant hard outline on a near-black
   page reads as a glitch; letting the offset settle over 150ms reads as an
   answer. Never removed — this is the only way some people navigate. */
:focus-visible{
  outline:2.5px solid var(--accent);
  outline-offset:3px;
  border-radius:2px;
  transition:outline-offset var(--dur-1) var(--ease-out);
}

/* ---------------------------------------------------------------------------
   Controls.

   Three states matter — hover, press, focus — and they have to be tellable
   apart without relying on colour, so each one changes shape as well as
   light: hover lifts and glows, press returns and compresses a little past
   its resting size, focus rings.

   Only transform, filter and box-shadow are animated. All three are
   compositor properties, so no number of these on screen can trigger a layout
   pass.
--------------------------------------------------------------------------- */
.btn,.cta,.topnav-try,.bar-try{
  display:inline-flex;align-items:center;justify-content:center;gap:.6em;
  font-family:var(--sans);font-weight:650;
  border:0;border-radius:var(--radius-pill);
  background:var(--accent);color:var(--on-accent);
  text-decoration:none;cursor:pointer;
  transition:transform var(--dur-1) var(--ease-out),
             box-shadow var(--dur-2) var(--ease-out),
             filter var(--dur-2) var(--ease-out);
}
.btn:hover,.cta:hover,.topnav-try:hover,.bar-try:hover{
  /* Brightened rather than swapped for a second hard-coded green: filter
     follows --accent through all five palettes, so the hover state can never
     be a colour belonging to a palette the reader is not using. The old
     #8ad4a5 stayed sage-green in every one of them. */
  filter:brightness(1.08);
  transform:translateY(-2px);
  box-shadow:var(--glow);
}
.btn:active,.cta:active,.topnav-try:active,.bar-try:active{
  transform:translateY(0) scale(.985);
}
.btn[disabled],.btn[aria-disabled="true"]{
  opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;filter:none;
}

/* The quiet button: same geometry, no fill. For where a page offers a second
   action and filling both would leave neither reading as the answer. */
.btn-ghost{
  background:transparent;color:var(--ink-2);
  box-shadow:inset 0 0 0 1px var(--line);
}
.btn-ghost:hover{
  background:var(--surface);color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--ink-3);filter:none;
}

/* Inputs. The border is the resting state and a ring of light is the focused
   one, so focusing changes brightness rather than thickness — a border that
   grows on focus shifts every pixel next to it. */
input,textarea,select{
  font:inherit;color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:.62em .8em;
  transition:border-color var(--dur-2) var(--ease-out),
             box-shadow var(--dur-2) var(--ease-out),
             background var(--dur-2) var(--ease-out);
}
input::placeholder,textarea::placeholder{color:var(--ink-3);opacity:1}
input:hover,textarea:hover,select:hover{border-color:var(--ink-3)}
input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:var(--accent);
  background:var(--surface-2);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}

/* Links in running text. The underline is always drawn — one that only
   appears on hover is invisible to everyone not hovering, which includes
   everyone on a phone — and what changes is its weight. */
a.link,.prose a{
  color:var(--accent);text-decoration:none;
  border-bottom:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  transition:border-color var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out);
}
a.link:hover,.prose a:hover{border-bottom-color:currentColor}

/* The travelling-bar loading state, for anything that has to wait. */
.is-loading{position:relative;overflow:hidden}
.is-loading::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,
             color-mix(in srgb,var(--accent) 22%,transparent),transparent);
  width:40%;animation:se-sweep 1.15s var(--ease-in-out) infinite;
  pointer-events:none;
}

/* ---------------------------------------------------------------------------
   Entrances. One gesture for the whole site: content rises a little and
   arrives.

   Gated behind .js, which a script in the head sets. Hiding content by
   default in plain CSS means that if that script never runs — blocked,
   errored, an old browser — the page is a blank rectangle. The animation is a
   nicety; the words are the point, and the words survive without it.
--------------------------------------------------------------------------- */
.js .reveal{
  opacity:0;transform:translate3d(0,14px,0);
  transition:opacity var(--dur-4) var(--ease-out),transform var(--dur-4) var(--ease-out);
}
.js .reveal.is-visible{opacity:1;transform:none}

/* ---------------------------------------------------------------------------
   Someone who has asked their system for less motion gets none of it. Last in
   the file so it beats everything above without needing !important on each
   individual property.

   Durations go to ~0 rather than `animation:none`, so anything that waits on a
   transitionend or animationend still fires and nothing gets stuck half-shown.
--------------------------------------------------------------------------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;
  }
  .js .reveal{opacity:1;transform:none}
}

/* @theme:end */

/* This page only, from here down. */
body{
  min-height:100svh;
  display:grid;place-items:center;padding:clamp(24px,7vw,64px);
}
.wrap{max-width:34rem;animation:se-rise var(--dur-4) var(--ease-out) both}

/* The flat line is the joke and the sign: everywhere else on this site a
   rhythm line has peaks in it, because there was writing to measure. Here
   there is nothing, so it reads flat.

   It now draws itself in, once, left to right — the same gesture the chart on
   the landing page makes, arriving at a line with nothing in it. */
.flat{width:100%;height:44px;display:block;margin-bottom:clamp(26px,5vw,38px)}
.js .flat .trace{
  stroke-dasharray:440;stroke-dashoffset:440;
  animation:se-draw 900ms var(--ease-out) 160ms forwards;
}
@keyframes se-draw{to{stroke-dashoffset:0}}
.eyebrow{
  font-family:var(--mono);font-size:var(--t-micro);letter-spacing:.18em;
  text-transform:uppercase;color:var(--amber);margin:0 0 1.2em;
}
h1{font-weight:700;font-size:clamp(2.1rem,8vw,3.1rem);line-height:1.02;margin:0 0 .55em}
p{color:var(--ink-2);margin:0 0 1.9em}
.links{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center}
/* Geometry only; the rest of the button is theme.css. */
.cta{font-weight:700;font-size:16px;padding:15px 24px}
.plain{
  color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line);
  display:inline-flex;align-items:center;min-height:34px;padding:0 4px;
  transition:color var(--dur-2) var(--ease-out),border-color var(--dur-2) var(--ease-out);
}
.plain:hover{color:var(--accent);border-bottom-color:currentColor}

@media (prefers-reduced-motion:reduce){
  .js .flat .trace{stroke-dashoffset:0;animation:none}
}
</style>
</head>

<div class="wrap">
  <svg class="flat" viewBox="0 0 440 44" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="22" x2="440" y2="22" stroke="currentColor" stroke-width="2" opacity=".25"/>
    <line class="trace" x1="0" y1="22" x2="440" y2="22" stroke="var(--accent)"
          stroke-width="2.4" opacity=".55"/>
  </svg>

  <p class="eyebrow">404</p>
  <h1>Nothing at this address.</h1>
  <p>The page you asked for isn't here — either the link was wrong, or it
  pointed at something that has since moved. Nothing you did broke it.</p>

  <div class="links">
    <a class="cta" href="/style-engine/app/">Measure my writing</a>
    <a class="plain" href="/style-engine/">Home</a>
    <a class="plain" href="/style-engine/pricing/">Shop</a>
  </div>
</div>
</body>
</html>
