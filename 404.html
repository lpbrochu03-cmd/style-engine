<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nothing at this address — Style Engine</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314160f'/%3E%3Cpath d='M3 20 L8 20 L10 9 L13 25 L16 14 L19 22 L22 17 L25 20 L29 20' fill='none' stroke='%2374c491' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --ground:#14160f;--surface:#1c1e16;--ink:#ecefe0;--ink-2:#b4b8a4;--ink-3:#7f8472;
  --line:#2f3325;--accent:#74c491;--amber:#d2a54c;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.6;
  display:grid;place-items:center;padding:clamp(24px,7vw,64px);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:34rem}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:2px}

/* The flat line is the joke and the sign: everywhere else on this site a
   rhythm line has peaks in it, because there was writing to measure. Here
   there is nothing, so it reads flat. */
.flat{width:100%;height:44px;display:block;margin-bottom:clamp(26px,5vw,38px)}
.eyebrow{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--amber);margin:0 0 1.2em;
}
h1{font-weight:800;font-size:clamp(2.1rem,8vw,3.1rem);line-height:1.02;
  letter-spacing:-.035em;margin:0 0 .55em;text-wrap:balance}
p{color:var(--ink-2);margin:0 0 1.9em}
.links{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center}
.cta{
  display:inline-flex;align-items:center;gap:.6em;background:var(--accent);color:var(--ground);
  font:700 16px/1 var(--sans);padding:15px 24px;border-radius:999px;text-decoration:none;
}
.cta:hover{background:#8ad4a5}
.plain{
  color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line);
  display:inline-flex;align-items:center;min-height:34px;padding:0 4px;
}
.plain:hover{color:var(--accent);border-bottom-color:currentColor}
</style>
</head>
<body>
<div class="wrap">
  <svg class="flat" viewBox="0 0 440 44" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="22" x2="440" y2="22" stroke="#2f3325" stroke-width="2"/>
    <line x1="0" y1="22" x2="440" y2="22" stroke="#74c491" stroke-width="2.4"
          stroke-dasharray="440" stroke-dashoffset="0" opacity=".55"/>
  </svg>

  <p class="eyebrow">404</p>
  <h1>Nothing at this address.</h1>
  <p>The page you asked for isn't here — either the link was wrong, or it
  pointed at something that has since moved. Nothing you did broke it.</p>

  <div class="links">
    <a class="cta" href="/style-engine/app/">Measure my writing</a>
    <a class="plain" href="/style-engine/">Home</a>
    <a class="plain" href="/style-engine/pricing/">Shop</a>
  </div>
</div>
</body>
</html>
